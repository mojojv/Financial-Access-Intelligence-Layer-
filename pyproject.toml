[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-access-intelligence"
version = "0.1.0"
description = "Financial Access Intelligence Layer built on Interledger Open Payments"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Open Payments Intelligence Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "redis>=5.0.3",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=42.0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]
ml = [
    "scikit-learn>=1.4.1",
    "numpy>=1.26.4",
    "pandas>=2.2.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "apps*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "asyncio: mark test as an asyncio coroutine (auto-applied in asyncio_mode=auto)",
    "integration: mark test as requiring external services (postgres, redis)",
    "slow: mark test as slow-running",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
