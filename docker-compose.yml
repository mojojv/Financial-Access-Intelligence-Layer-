version: "3.9"

services:
  # ─────────────────────────────────────────────────────────────────────────
  # PostgreSQL 16 — Primary persistent store
  # ─────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: fail_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fail_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fail_secret}
      POSTGRES_DB: ${POSTGRES_DB:-fail_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fail_user} -d ${POSTGRES_DB:-fail_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fail_network

  # ─────────────────────────────────────────────────────────────────────────
  # Redis 7 — Cache & event streaming (optional, app degrades gracefully)
  # ─────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fail_redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - fail_network

  # ─────────────────────────────────────────────────────────────────────────
  # Financial Access Intelligence Layer API
  # ─────────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fail_api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fail_user}:${POSTGRES_PASSWORD:-fail_secret}@postgres:5432/${POSTGRES_DB:-fail_db}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - fail_network
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Prometheus — Metrics scraper
  # ─────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: fail_prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - fail_network
    depends_on:
      - api

  # ─────────────────────────────────────────────────────────────────────────
  # Grafana — Observability dashboard
  # ─────────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: fail_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - fail_network
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  fail_network:
    driver: bridge
