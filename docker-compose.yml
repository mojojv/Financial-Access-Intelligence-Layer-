version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — Primary Relational Store
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: fail_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fail_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fail_secret}
      POSTGRES_DB: ${POSTGRES_DB:-fail_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fail_user} -d ${POSTGRES_DB:-fail_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fail_network

  # ---------------------------------------------------------------------------
  # Redis 7 — Cache & Event Streaming Broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: fail_redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - fail_network

  # ---------------------------------------------------------------------------
  # Financial Access Intelligence FastAPI Server
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fail_api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fail_user}:${POSTGRES_PASSWORD:-fail_secret}@postgres:5432/${POSTGRES_DB:-fail_db}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - fail_network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Worker Service — Asynchronous Intervention & Telemetry Worker
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fail_worker
    command: python -m apps.api.server
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fail_user}:${POSTGRES_PASSWORD:-fail_secret}@postgres:5432/${POSTGRES_DB:-fail_db}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fail_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  fail_network:
    driver: bridge
